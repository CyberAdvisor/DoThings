# Creates the vX.Y.Z tag and GitHub release for each new version pushed to main.
#
# Version: 1.9.0
#
# Change log:
# - v1.9.0 (2026-11-10): Synchronized module version metadata.
# - v1.8.0 (2026-11-10): Synchronized module version metadata.
# - v1.7.1 (2026-11-10): Synchronized module version metadata.
# - v1.7.0 (2026-11-10): Synchronized module version metadata.
# - v1.6.0 (2026-11-10): Synchronized module version metadata.
# - v1.5.0 (2026-11-08): Synchronized module version metadata.
# - v1.4.0 (2026-11-08): Synchronized module version metadata.
# - v1.3.1 (2026-11-08): Synchronized module version metadata.
# - v1.3.0 (2026-11-08): Synchronized module version metadata.
# - v1.2.0 (2026-11-08): Synchronized module version metadata.
# - v1.1.0 (2026-11-08): Synchronized module version metadata.
# - v1.0.3 (2026-11-07): Synchronized module version metadata.
# - v1.0.2 (2026-11-07): Synchronized module version metadata.
# - v1.0.1 (2026-11-07): Change log trimmed to v1.0.0 and later; earlier history is in git.
# - v1.0.0 (2026-11-07): Synchronized module version metadata.
#
# On every push to main it reads VERSION. If the tag for that version does not
# exist yet, it creates the tag on the pushed commit and a release titled with
# the commit subject, using the commit message body (without the trailing
# Co-Authored-By / Claude-Session lines) as the release notes. Pushes that do
# not change VERSION find the tag already present and do nothing.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write  # needed to create tags and releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags, so an existing tag is detected

      - name: Create tag and release for VERSION
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          # Fail safe: refuse to tag anything that is not a plain X.Y.Z version.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION is not X.Y.Z: '$version'" >&2
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release."
            exit 0
          fi
          title="$(git log -1 --format=%s "$GITHUB_SHA")"
          git log -1 --format=%b "$GITHUB_SHA" | sed '/^Co-Authored-By:/,$d' > release-notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md
