<!DOCTYPE html>
<!--
  Do Things page. Served by serve.py; all rules and data live on the server,
  this page only renders lists and sends actions.

  Version: 0.1.26

  Change log:
  - v0.1.26 (2026-11-07): + Deadline and + When open the date picker again; the
    click that opened it no longer counted as a click outside and closed it.
  - v0.1.25 (2026-11-07): Editor note on priority changes describes the kept later deadline.
  - v0.1.24 (2026-11-07): Synchronized module version metadata.
  - v0.1.23 (2026-11-07): After saving an edit, the row shows a P tag only in
    the Overdue search, matching the server.
  - v0.1.22 (2026-11-07): After saving an edit in Today, the row shows no P tag
    (Today's groups show the priority).
  - v0.1.21 (2026-11-07): The notes icon is a page with a folded corner, as in Things.
  - v0.1.20 (2026-11-07): Settings in the sidebar (replacing the token link):
    replace the Things auth token, and choose Dark or Light appearance
    (dark by default, remembered in this browser).
  - v0.1.19 (2026-11-07): Rows look like Things: rounded-square checkboxes
    (also Hide Completed), tags as outlined pills right after the title with
    P tags included, gray icons after the title for repeating, notes and
    checklist, a start-date badge before the title for later starts, and a
    filled flag with Things' deadline wording (red when today or overdue).
  - v0.1.18 (2026-11-07): Synchronized module version metadata.
  - v0.1.17 (2026-11-07): Synchronized module version metadata.
  - v0.1.16 (2026-11-07): Synchronized module version metadata.
  - v0.1.15 (2026-11-07): Synchronized module version metadata.
  - v0.1.14 (2026-11-07): Deferring When to a later date (Tomorrow or the
    calendar) moves a deadline that is before it to that date, visibly.
  - v0.1.13 (2026-11-07): Moves, reorders, check-offs and edit saves update
    the page immediately and are confirmed with Things in the background, in
    order (a failure redraws Things' real state with a message). Tomorrow
    button on the editor's When line.
  - v0.1.12 (2026-11-07): Today's gray count is the tasks that aren't due (as
    in Things). The Hide Completed checkbox is the same round circle as the
    task checkboxes.
  - v0.1.11 (2026-11-07): "Hide Completed" checkbox under the searches hides
    tasks checked off today in every view; remembered in this browser.
  - v0.1.10 (2026-11-07): Sidebar counts as in Things: Inbox items, and for
    Today a red badge of tasks due today or overdue plus the open total. The
    editor shows checklist progress next to Open in Things.
  - v0.1.9 (2026-11-07): Picking Someday or Anytime for When also removes the
    deadline (the Deadline row disappears; it can be added back before saving).
  - v0.1.8 (2026-11-07): When and Deadline open a date picker (calendar with
    Today/Someday/Anytime or Clear) instead of a menu and date field. Copies
    of repeating to-dos are no longer locked.
  - v0.1.7 (2026-11-07): Clicking a task expands it into an inline editor
    (title, notes, tags, When, deadline, project/area and heading, priority)
    with Save and Cancel; empty fields are added with buttons. Open in Things
    moved into the editor.
  - v0.1.6 (2026-11-07): Checkbox on every task in Today and the searches.
    Checking completes the task in Things, shows it dim gray and struck
    through, and moves it to the bottom of its group; unchecking reopens it.
  - v0.1.5 (2026-11-07): Inbox, Upcoming, Anytime, Someday and Logbook open in
    Things (marked with an arrow). The missing-tags and token warnings, and the
    failed-move message, now give step-by-step fixes.
  - v0.1.4 (2026-11-07): Synchronized module version metadata.
  - v0.1.3 (2026-11-07): Synchronized module version metadata.
  - v0.1.2 (2026-11-07): Synchronized module version metadata.
  - v0.1.1 (2026-11-07): Synchronized module version metadata.
  - v0.1.0 (2026-11-07): Initial release.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Do Things</title>
<link rel="icon" href="data:,">
<style>
  /* Light appearance; dark (the default, set on <html>) overrides it below. */
  :root {
    --bg: #ffffff; --sidebar: #f4f4f6; --text: #1d1d1f; --muted: #8a8a8e;
    --line: #e6e6e9; --hover: #eef0f4; --selected: #dfe3ea; --accent: #2f6fe4;
    --red: #e5484d; --pill: #eceef1; --banner: #fff4e5; --banner-text: #8a4b00;
  }
  :root[data-theme="dark"] {
    --bg: #1e1f22; --sidebar: #26272b; --text: #ececee; --muted: #8e8e93;
    --line: #34353a; --hover: #2e3035; --selected: #3a3d44; --accent: #5b8cff;
    --red: #ff6369; --pill: #34363b; --banner: #3a2e1c; --banner-text: #ffc879;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  /* Sidebar */
  nav {
    width: 240px; flex-shrink: 0; background: var(--sidebar); padding: 20px 10px;
    display: flex; flex-direction: column; border-right: 1px solid var(--line);
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px; padding: 5px 10px; border-radius: 6px;
    cursor: pointer; user-select: none;
  }
  .nav-item:hover { background: var(--hover); }
  .nav-item.selected { background: var(--selected); }
  .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
  .nav-gap { height: 14px; }
  .nav-heading { color: var(--muted); font-size: 12px; font-weight: 600; padding: 4px 10px; }
  .nav-item .extra { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .nav-item .count { color: var(--muted); font-size: 12px; }
  .nav-item .badge {
    background: var(--red); color: #fff; font-size: 11px; font-weight: 700;
    border-radius: 9px; padding: 0 6px; min-width: 8px; text-align: center;
  }
  .nav-item .opens-things { color: var(--muted); }
  .nav-option { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer; }
  /* The Hide Completed checkbox looks like a task's checkbox. */
  .nav-option input {
    appearance: none; -webkit-appearance: none; margin: 0; width: 16px; height: 16px; flex-shrink: 0;
    border: 1.5px solid var(--muted); border-radius: 4px; cursor: pointer; position: relative;
  }
  .nav-option input:checked { background: var(--muted); }
  .nav-option input:checked::after {
    content: ""; position: absolute; left: 4.5px; top: 1.5px; width: 3px; height: 7px;
    border: solid #fff; border-width: 0 1.6px 1.6px 0; transform: rotate(45deg);
  }
  .nav-item .opens-things svg { width: 12px; height: 12px; }
  .nav-footer { margin-top: auto; padding: 8px 0; }
  .nav-footer .version { color: var(--muted); font-size: 12px; padding: 6px 10px 0; }
  /* Settings page */
  .settings h2 { font-size: 15px; margin: 22px 0 6px; }
  .settings p { color: var(--muted); margin: 0 0 10px; }
  .settings .seg { display: inline-flex; }
  .settings .seg button { border-radius: 0; background: var(--bg); color: var(--text); }
  .settings .seg button:first-child { border-radius: 6px 0 0 6px; }
  .settings .seg button:last-child { border-radius: 0 6px 6px 0; }
  .settings .seg button.on { background: var(--accent); color: #fff; }
  /* Main area */
  main { flex: 1; overflow-y: auto; padding: 36px 48px 80px; }
  .content { max-width: 720px; margin: 0 auto; }
  h1 { display: flex; align-items: center; gap: 10px; font-size: 26px; margin: 0 0 22px; }
  h1 svg { width: 26px; height: 26px; }
  .banner {
    background: var(--banner); color: var(--banner-text); border-radius: 8px;
    padding: 10px 14px; margin-bottom: 16px;
  }
  .banner button { margin-left: 8px; }
  .banner ol { margin: 6px 0 0; padding-left: 20px; }
  .banner p { margin: 0; }
  .status { color: var(--muted); font-size: 12px; min-height: 18px; margin-bottom: 4px; }
  /* Priority groups */
  section.group { margin-bottom: 26px; }
  section.group h2 {
    font-size: 15px; margin: 0 0 4px; padding-bottom: 6px; border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: baseline;
  }
  section.group h2 .tag { color: var(--muted); font-weight: 500; font-size: 12px; }
  .drop-zone { min-height: 34px; padding: 2px 0; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 10px; }
  /* Task rows */
  .task {
    display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 6px;
    cursor: pointer;
  }
  .task:hover { background: var(--hover); }
  .task.dragging { opacity: 0.4; }
  .task.saving { opacity: 0.6; } /* Shown as changed; Things hasn't confirmed it yet. */
  /* Completion checkbox, a rounded square like Things. */
  .check {
    width: 16px; height: 16px; flex-shrink: 0; border-radius: 4px; padding: 0;
    border: 1.5px solid var(--muted); background: transparent; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .check svg { width: 10px; height: 10px; visibility: hidden; }
  .task.done .check { background: var(--muted); border-color: var(--muted); }
  .task.done .check svg { visibility: visible; }
  .task.done { opacity: 0.55; }
  .task.done .title { text-decoration: line-through; color: var(--muted); }
  .task .body { flex: 1; min-width: 0; }
  /* First line, as in Things: [start badge] title [icons] [tag pills]. */
  .task .line { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .task .title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
  .task .icon { color: var(--muted); display: flex; flex-shrink: 0; }
  .task .icon svg { width: 13px; height: 13px; }
  .task .when-badge {
    background: var(--pill); color: var(--muted); border-radius: 4px; padding: 0 5px;
    font-size: 11px; flex-shrink: 0;
  }
  .task .context { color: var(--muted); font-size: 12px; }
  .pill {
    border: 1px solid var(--muted); color: var(--muted); border-radius: 10px; padding: 0 7px;
    font-size: 11px; flex-shrink: 0; white-space: nowrap;
  }
  .deadline { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  .deadline.overdue, .deadline.today { color: var(--red); }
  .deadline svg { width: 12px; height: 12px; }
  /* Inline editor: the clicked task expands into a card, like Things. */
  .editor {
    background: var(--hover); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; margin: 6px 0 10px; display: flex; flex-direction: column; gap: 8px;
  }
  .editor .head { display: flex; align-items: center; gap: 10px; }
  .editor input, .editor select, .editor textarea {
    font: inherit; color: var(--text); background: transparent; border: none; outline: none;
  }
  .editor .ed-title { flex: 1; font-size: 15px; }
  .editor textarea {
    resize: vertical; min-height: 44px; margin-left: 26px; color: var(--text);
    border-left: 2px solid var(--line); padding-left: 8px;
  }
  .editor .ed-row { display: flex; align-items: center; gap: 8px; margin-left: 26px; font-size: 13px; flex-wrap: wrap; }
  .editor .ed-row .label { color: var(--muted); min-width: 64px; }
  .editor .ed-row select, .editor .ed-row input[type=date] {
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; background: var(--bg);
  }
  .editor .ed-x { background: none; border: none; color: var(--muted); padding: 0 4px; cursor: pointer; }
  .editor .chip { background: var(--pill); border-radius: 10px; padding: 1px 4px 1px 9px; font-size: 12px; }
  .editor .seg button { padding: 2px 10px; border-radius: 0; background: var(--bg); color: var(--text); }
  .editor .seg button:first-child { border-radius: 6px 0 0 6px; }
  .editor .seg button:last-child { border-radius: 0 6px 6px 0; }
  .editor .seg button.on { background: var(--accent); color: #fff; }
  .editor .note { color: var(--muted); font-size: 12px; margin-left: 26px; }
  .editor .foot { display: flex; align-items: center; gap: 8px; margin-left: 26px; }
  .editor .adders { display: flex; gap: 4px; margin-left: auto; }
  .editor .adders button { background: none; border: 1px solid var(--line); color: var(--muted); padding: 2px 8px; font-size: 12px; }
  .editor .ed-date {
    background: none; border: 1px solid transparent; color: var(--text); padding: 2px 6px; font-size: 13px;
  }
  .editor .ed-date:hover { border-color: var(--line); }
  .editor .ed-date.overdue { color: var(--red); }
  .editor .ed-tomorrow { padding: 2px 10px; font-size: 12px; }
  /* Date picker popover under the When or Deadline row. */
  .picker {
    margin-left: 26px; width: 236px; padding: 8px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); box-shadow: 0 4px 14px rgba(0, 0, 0, .25); font-size: 12px;
  }
  .picker .quick { display: flex; gap: 4px; margin-bottom: 6px; }
  .picker .quick button { flex: 1; padding: 3px 4px; font-size: 12px; background: var(--hover); color: var(--text); }
  .picker .month { display: flex; align-items: center; justify-content: space-between; margin: 4px 0; font-weight: 600; }
  .picker .month button { background: none; border: none; color: var(--text); padding: 0 8px; font-size: 14px; }
  .picker .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .picker .grid .dow { color: var(--muted); font-size: 11px; }
  .picker .grid button { background: none; border: 1px solid transparent; color: var(--text); padding: 3px 0; border-radius: 6px; }
  .picker .grid button:hover { background: var(--hover); }
  .picker .grid button.today { color: var(--accent); font-weight: 700; }
  .picker .grid button.chosen { background: var(--accent); color: #fff; }
  .editor .checklist { color: var(--muted); font-size: 12px; }
  .editor .ed-status { color: var(--red); font-size: 12px; margin-left: 26px; min-height: 0; }
  .drop-marker { height: 2px; background: var(--accent); border-radius: 1px; margin: 0 10px; }
  /* Setup screen */
  .setup p { color: var(--muted); }
  .setup ol { padding-left: 20px; }
  .setup input {
    width: 100%; font: inherit; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); margin: 6px 0 10px;
  }
  button {
    font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--text); }
  .error { color: var(--red); }
</style>
</head>
<body>
<nav id="sidebar"></nav>
<main><div class="content" id="content"></div></main>

<script>
"use strict";

// Sidebar entries: Things' built-in lists, then the custom searches.
const ICONS = {
  inbox: '<svg viewBox="0 0 20 20"><rect x="2" y="3" width="16" height="14" rx="3" fill="#3a8ef6"/><path d="M5 11h3l1 2h2l1-2h3" stroke="#fff" stroke-width="1.6" fill="none"/></svg>',
  today: '<svg viewBox="0 0 20 20"><path d="M10 1.8l2.5 5.2 5.7.8-4.1 4 1 5.6L10 14.7l-5.1 2.7 1-5.6-4.1-4 5.7-.8z" fill="#f5c400"/></svg>',
  upcoming: '<svg viewBox="0 0 20 20"><rect x="2" y="3" width="16" height="15" rx="3" fill="#e5484d"/><rect x="4" y="7" width="12" height="9" rx="1" fill="#fff"/></svg>',
  anytime: '<svg viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="4" rx="1.5" fill="#2bb5a5"/><rect x="3" y="8.5" width="14" height="4" rx="1.5" fill="#2bb5a5" opacity=".75"/><rect x="3" y="14" width="14" height="4" rx="1.5" fill="#2bb5a5" opacity=".5"/></svg>',
  someday: '<svg viewBox="0 0 20 20"><rect x="2" y="4" width="16" height="4" rx="1" fill="#c9a86a"/><rect x="3" y="8" width="14" height="9" rx="1.5" fill="#dcc08c"/><rect x="7.5" y="10" width="5" height="1.6" rx=".8" fill="#fff"/></svg>',
  logbook: '<svg viewBox="0 0 20 20"><rect x="2" y="2" width="16" height="16" rx="4" fill="#3bb24f"/><path d="M6 10.3l2.6 2.6L14 7.5" stroke="#fff" stroke-width="2" fill="none"/></svg>',
  settings: '<svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6" fill="none" stroke="#8e8e93" stroke-width="1.8"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round"/></svg>',
  search: '<svg viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5" stroke="#8e8e93" stroke-width="2" fill="none"/><path d="M12.3 12.3L17 17" stroke="#8e8e93" stroke-width="2"/></svg>',
};
// Tick shown inside a checked checkbox.
const TICK = '<svg viewBox="0 0 10 10"><path d="M2 5.2l2 2L8 3" stroke="#fff" stroke-width="1.6" fill="none"/></svg>';
// Marks sidebar entries that open in Things instead of in Do Things.
const OPENS_IN_THINGS = '<svg viewBox="0 0 12 12"><path d="M4 2h6v6M10 2L3 9" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>';
// Filled deadline flag, as in Things.
const FLAG = '<svg viewBox="0 0 12 12"><path d="M2 1v10" stroke="currentColor" stroke-width="1.3"/><path d="M2.6 1.5h7l-1.6 2.5L9.6 6.5h-7z" fill="currentColor"/></svg>';
// Gray row icons shown after the title, as in Things.
const ROW_ICONS = {
  repeating: '<svg viewBox="0 0 14 14"><path d="M11.5 7A4.5 4.5 0 1 1 9.6 3.3" stroke="currentColor" stroke-width="1.4" fill="none"/><path d="M9 1v3h3" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>',
  notes: '<svg viewBox="0 0 14 14"><path d="M3.5 1.5h4.5l3 3v8h-7.5z M8 1.5v3h3" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" fill="none"/></svg>',
  checklist: '<svg viewBox="0 0 14 14"><circle cx="3" cy="3.5" r="1.3" fill="none" stroke="currentColor"/><circle cx="3" cy="7" r="1.3" fill="none" stroke="currentColor"/><circle cx="3" cy="10.5" r="1.3" fill="none" stroke="currentColor"/><path d="M6 3.5h6M6 7h6M6 10.5h6" stroke="currentColor" stroke-width="1.3"/></svg>',
};
// `things: true` entries open that list in Things; the rest are shown here.
const LISTS = [
  { id: "inbox", name: "Inbox", icon: "inbox", things: true },
  { id: "today", name: "Today", icon: "today" },
  { id: "upcoming", name: "Upcoming", icon: "upcoming", things: true },
  { id: "anytime", name: "Anytime", icon: "anytime", things: true },
  { id: "someday", name: "Someday", icon: "someday", things: true },
  { id: "logbook", name: "Logbook", icon: "logbook", things: true },
  null, // Gap before the custom searches.
  { id: "p1", name: "P1 · Due Today", icon: "search" },
  { id: "p2", name: "P2 · To Do", icon: "search" },
  { id: "p3", name: "P3 · Follow Up", icon: "search" },
  { id: "overdue", name: "Overdue", icon: "search" },
];
const REFRESH_MS = 60000;

const state = {
  list: "today",
  view: "list",   // "list" or "setup"
  busy: false,    // True while the editor's task is being loaded.
  pending: 0,     // Changes sent to Things and not yet confirmed (see enqueue).
  drag: null,     // { id, from } while a task is being dragged.
  status: "",     // Message above the list; kept across redraws until replaced.
  edit: null,     // The open inline editor (see startEdit), or null.
  counts: null,   // Sidebar counts from the last list response: {inbox, today: {due, not_due}}.
  hideCompleted: loadSetting("hideCompleted", false), // "Hide Completed" sidebar option.
  theme: loadSetting("theme", "dark"), // Appearance: "dark" (default) or "light".
  version: "",
};

// --- Helpers ---------------------------------------------------------------

/** Read a saved setting from this browser, or `fallback` if none or storage is unavailable. */
function loadSetting(key, fallback) {
  try {
    const value = window.localStorage.getItem(`dothings.${key}`);
    return value === null ? fallback : JSON.parse(value);
  } catch (error) {
    return fallback;
  }
}

/** Save a setting in this browser; it is simply not remembered if storage is unavailable. */
function saveSetting(key, value) {
  try {
    window.localStorage.setItem(`dothings.${key}`, JSON.stringify(value));
  } catch (error) {
    // Storage blocked or full: the setting still applies until the page is reloaded.
  }
}

/** Create an element with optional class and text (text is never parsed as HTML). */
function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

/** Call the local API. The X-Do-Things header is required by the server on writes. */
async function api(path, body) {
  const options = body === undefined ? {} : {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Do-Things": "1" },
    body: JSON.stringify(body),
  };
  const response = await fetch(path, options);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.error || `Request failed (${response.status})`);
  return data;
}

/** Show a short message above the task list; it stays until replaced or the list changes. */
function setStatus(text) {
  state.status = text || "";
  const status = document.getElementById("status");
  if (status) status.textContent = state.status;
}

// --- Sidebar ---------------------------------------------------------------

/** Draw the sidebar, highlighting the current list. */
function renderSidebar() {
  const nav = document.getElementById("sidebar");
  nav.replaceChildren();
  for (const entry of LISTS) {
    if (entry === null) {
      nav.append(el("div", "nav-gap"), el("div", "nav-heading", "Searches"));
      continue;
    }
    const item = el("div", "nav-item" + (state.view === "list" && state.list === entry.id ? " selected" : ""));
    item.innerHTML = ICONS[entry.icon]; // Static icon markup only.
    item.append(el("span", "", entry.name));
    const extra = el("span", "extra");
    item.append(extra);
    appendCounts(extra, entry.id);
    if (entry.things) {
      const mark = el("span", "opens-things");
      mark.innerHTML = OPENS_IN_THINGS; // Static icon markup only.
      extra.append(mark);
      item.title = "Opens in Things";
      item.onclick = () => showThingsList(entry.id);
    } else {
      // Switching lists closes an open editor without saving.
      item.onclick = () => { state.list = entry.id; state.view = "list"; state.edit = null; setStatus(""); load(); };
    }
    nav.append(item);
  }
  const option = el("label", "nav-option");
  const hide = el("input");
  hide.type = "checkbox";
  hide.checked = state.hideCompleted;
  hide.onchange = () => {
    state.hideCompleted = hide.checked;
    saveSetting("hideCompleted", hide.checked);
    load();
  };
  option.append(hide, el("span", "", "Hide Completed"));
  nav.append(option);
  const footer = el("div", "nav-footer");
  const settings = el("div", "nav-item" + (state.view === "settings" ? " selected" : ""));
  settings.innerHTML = ICONS.settings; // Static icon markup only.
  settings.append(el("span", "", "Settings"));
  settings.onclick = showSettings;
  footer.append(settings, el("div", "version", state.version ? `Do Things v${state.version}` : ""));
  nav.append(footer);
}

/**
 * Add the counts Things shows beside a sidebar entry: the Inbox item count,
 * and for Today a red badge of tasks due today or overdue plus the number of
 * other (not due) open tasks.
 * Zero counts are not shown.
 */
function appendCounts(extra, id) {
  const counts = state.counts;
  if (!counts) return;
  if (id === "today") {
    if (counts.today.due) extra.append(el("span", "badge", String(counts.today.due)));
    if (counts.today.not_due) extra.append(el("span", "count", String(counts.today.not_due)));
  } else if (id === "inbox" && counts.inbox) {
    extra.append(el("span", "count", String(counts.inbox)));
  }
}

// --- Task lists --------------------------------------------------------------

/** Build one task row. Open Today rows are draggable between and within groups. */
function taskRow(task, priority) {
  const row = el("div", "task" + (task.completed ? " done" : ""));
  row.dataset.id = task.id;
  const check = el("button", "check");
  check.type = "button";
  check.title = task.completed ? "Mark as not done" : "Mark as done";
  check.setAttribute("aria-label", check.title);
  check.innerHTML = TICK; // Static icon markup only.
  check.onclick = (event) => {
    event.stopPropagation(); // Checking a task must not open it in Things.
    toggleComplete(row, task);
  };
  row.append(check);
  const body = el("div", "body");
  const line = el("div", "line");
  if (task.start_label) line.append(el("span", "when-badge", task.start_label));
  line.append(el("span", "title", task.title || "New To-Do"));
  for (const [key, label] of [["repeating", "Repeating"], ["has_notes", "Notes"], ["has_checklist", "Checklist"]]) {
    if (!task[key]) continue;
    const icon = el("span", "icon");
    icon.title = label;
    icon.innerHTML = ROW_ICONS[key.replace("has_", "")]; // Static icon markup only.
    line.append(icon);
  }
  for (const tag of task.tags) line.append(el("span", "pill", tag));
  body.append(line);
  if (task.context) body.append(el("div", "context", task.context));
  row.append(body);
  if (task.deadline_label) {
    // Red when today or overdue, gray when later, as in Things.
    const flag = el("span", "deadline " + (task.deadline_state || ""));
    flag.innerHTML = FLAG; // Static icon markup only.
    flag.append(task.deadline_label);
    row.append(flag);
  }
  row.onclick = () => startEdit(row, task.id);
  if (priority && !task.completed) {
    row.draggable = true;
    row.addEventListener("dragstart", (event) => {
      // No dragging while editing, or a row whose last change isn't confirmed yet.
      if (state.edit || row.classList.contains("saving")) { event.preventDefault(); return; }
      state.drag = { id: task.id, from: priority };
      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", task.id);
      row.classList.add("dragging");
    });
    row.addEventListener("dragend", () => {
      row.classList.remove("dragging");
      state.drag = null;
      removeMarker();
    });
  }
  return row;
}

/** Add the list title with its icon. */
function renderHeader(content, entry) {
  const heading = el("h1");
  heading.innerHTML = ICONS[entry.icon]; // Static icon markup only.
  heading.append(entry.name);
  content.append(heading);
}

/** Build a warning banner: an intro line and numbered steps. */
function stepsBanner(intro, steps) {
  const banner = el("div", "banner");
  banner.append(el("p", "", intro));
  const list = el("ol");
  for (const step of steps) list.append(el("li", "", step));
  banner.append(list);
  return banner;
}

// Checks for a change Things did not apply, in the order to try them.
const WRITE_FAILED_STEPS = [
  "Things is open.",
  "In Things › Settings › General, Enable Things URLs is on.",
  "The token matches: click Manage there, copy the token, then click Update token.",
];

/** One-line status message for a change (e.g. "the move") that Things didn't apply. */
function writeFailedMessage(what) {
  return `Things didn't apply ${what}. Check: ` + WRITE_FAILED_STEPS.map((s, i) => `${i + 1}. ${s}`).join(" ");
}

/** Add warnings about missing tags or an unconfirmed write. */
function renderBanners(content, data) {
  if (data.missing_tags && data.missing_tags.length) {
    content.append(stepsBanner(
      `Do Things needs tags named P1, P2 and P3 in Things. Missing: ${data.missing_tags.join(", ")}. ` +
      "Until they exist, Do Things won't change any tags.",
      [
        "In Things, open Window › Tags.",
        "Add each missing tag, spelled exactly as shown.",
        "Come back to this page. It checks again automatically.",
      ]));
  }
  if (data.write_failed) {
    const banner = stepsBanner("Things didn't apply a change from Do Things. Check:", WRITE_FAILED_STEPS);
    const fix = el("button", "secondary", "Update token");
    fix.onclick = () => showSetup(false);
    banner.append(fix);
    content.append(banner);
  }
}

/** Draw a list: priority groups for Today, a flat list otherwise. */
function renderList(data) {
  const content = document.getElementById("content");
  content.replaceChildren();
  renderHeader(content, LISTS.find((l) => l && l.id === data.name));
  renderBanners(content, data);
  const status = el("div", "status", state.status);
  status.id = "status";
  content.append(status);
  if (data.groups) {
    for (const group of data.groups) content.append(renderGroup(group));
  } else {
    const zone = el("div", "drop-zone");
    if (!data.tasks.length) zone.append(el("div", "empty", "Nothing here."));
    for (const task of data.tasks) zone.append(taskRow(task, null));
    content.append(zone);
  }
}

/** Build a Today priority section that accepts dropped tasks. */
function renderGroup(group) {
  const section = el("section", "group");
  const title = el("h2", "", group.label);
  title.append(el("span", "tag", group.priority));
  const zone = el("div", "drop-zone");
  zone.dataset.priority = group.priority;
  if (!group.tasks.length) zone.append(el("div", "empty", "No tasks"));
  for (const task of group.tasks) zone.append(taskRow(task, group.priority));
  zone.addEventListener("dragover", (event) => {
    if (!state.drag) return;
    event.preventDefault();
    placeMarker(zone, event.clientY);
  });
  zone.addEventListener("drop", (event) => {
    event.preventDefault();
    if (state.drag) dropTask(zone, event.clientY);
  });
  section.append(title, zone);
  return section;
}

// --- Drag and drop -----------------------------------------------------------

/** Return the rows in a zone other than the one being dragged. */
function otherRows(zone) {
  return [...zone.querySelectorAll(".task")].filter((r) => r.dataset.id !== state.drag.id);
}

/** Index where a drop at clientY would insert, based on row midpoints. */
function dropIndex(zone, clientY) {
  const rows = otherRows(zone);
  const index = rows.findIndex((r) => {
    const box = r.getBoundingClientRect();
    return clientY < box.top + box.height / 2;
  });
  return index === -1 ? rows.length : index;
}

/** Remove the drop position marker. */
function removeMarker() {
  document.querySelectorAll(".drop-marker").forEach((m) => m.remove());
}

/** Show where a dragged task would land. */
function placeMarker(zone, clientY) {
  removeMarker();
  const rows = otherRows(zone);
  const index = dropIndex(zone, clientY);
  const marker = el("div", "drop-marker");
  if (index < rows.length) zone.insertBefore(marker, rows[index]);
  else zone.append(marker);
}

// --- Background saving ------------------------------------------------------

// Changes run one at a time, in the order made, so Things sees them in order.
let saveQueue = Promise.resolve();

/**
 * Send a change to Things in the background. The page has already been
 * updated to show it; `row` (if any) is dimmed until Things confirms. When the
 * last pending change finishes the list is redrawn from Things, so a change
 * Things didn't apply goes back to how it really is, with a message naming
 * `what` failed.
 */
function enqueue(row, what, request) {
  state.pending++;
  if (row) {
    row.classList.add("saving");
    row.draggable = false;
  }
  setStatus("");
  saveQueue = saveQueue.then(async () => {
    try {
      const result = await request();
      if (!result.ok) setStatus(writeFailedMessage(what));
    } catch (error) {
      setStatus(error.message);
    } finally {
      state.pending--;
      if (!state.pending) load();
    }
  });
}

/** Save a drop: a reorder within a group, or a move to another priority. */
function dropTask(zone, clientY) {
  const { id, from } = state.drag;
  const to = zone.dataset.priority;
  const rows = otherRows(zone);
  const index = dropIndex(zone, clientY);
  const ids = rows.map((r) => r.dataset.id);
  ids.splice(index, 0, id);
  removeMarker();
  // Show the task in its new place straight away.
  const row = document.querySelector(`.task[data-id="${CSS.escape(id)}"]`);
  zone.querySelectorAll(".empty").forEach((e) => e.remove());
  zone.insertBefore(row, rows[index] || null);
  enqueue(row, "the move", () => from === to
    ? api("/api/order", { priority: to, order: ids })
    : api("/api/move", { id, priority: to, order: ids }));
}

/**
 * Complete or reopen a task. The row changes right away (checked rows move to
 * the bottom of their group); if Things doesn't confirm, the reload puts it back.
 */
function toggleComplete(row, task) {
  if (state.edit) { editorMessage("Save or cancel the open task first."); return; }
  const completed = !task.completed;
  task.completed = completed; // A second click before the redraw toggles back.
  row.classList.toggle("done", completed);
  if (completed) row.parentNode.append(row);
  enqueue(row, "the change", () => api("/api/complete", { id: task.id, completed }));
}

// --- Inline editor ----------------------------------------------------------

/**
 * Expand a task row into the inline editor. `state.edit` holds the task as
 * loaded (`task`), the edit-view choices (`options`), the edited copy
 * (`draft`), which optional rows are shown (`shown`) and the card element.
 * While it is open the list doesn't refresh and rows can't be dragged.
 */
async function startEdit(row, id) {
  if (state.edit) { editorMessage("Save or cancel the open task first."); return; }
  if (state.busy || state.drag) return;
  if (state.pending) { setStatus("Still saving your last change. Try again in a moment."); return; }
  state.busy = true;
  try {
    const { task, options, today } = await api(`/api/task?id=${encodeURIComponent(id)}`);
    state.edit = {
      task, options, today, card: row,
      picker: null,       // "when" or "deadline" while that date picker is open.
      pickerMonth: null,  // First day of the month the picker shows (YYYY-MM-01).
      draft: {
        title: task.title, notes: task.notes, when: { ...task.when }, deadline: task.deadline || "",
        priority: task.priority, tags: [...task.other_tags], list_id: task.list_id, heading_id: task.heading_id,
      },
      // Empty fields start hidden and are added with the buttons at the bottom.
      shown: {
        tags: task.other_tags.length > 0, when: task.when.kind !== "anytime",
        deadline: Boolean(task.deadline), list: Boolean(task.list_id),
      },
    };
    redrawEditor();
    state.edit.card.querySelector(".ed-title").focus();
  } catch (error) {
    setStatus(error.message);
  } finally {
    state.busy = false;
  }
}

/** Replace the editor card (or the row it opened from) with a freshly built one. */
function redrawEditor() {
  const card = buildEditor();
  state.edit.card.replaceWith(card);
  state.edit.card = card;
}

/** Show a message inside the open editor. */
function editorMessage(text) {
  const line = state.edit && state.edit.card.querySelector(".ed-status");
  if (line) line.textContent = text;
}

/** Build a labelled editor row. */
function editorRow(label, ...children) {
  const row = el("div", "ed-row");
  row.append(el("span", "label", label), ...children);
  return row;
}

/** Build a <select> from [value, label] pairs. */
function selectOf(pairs, value) {
  const select = el("select");
  for (const [v, label] of pairs) {
    const option = el("option", "", label);
    option.value = v;
    select.append(option);
  }
  select.value = value;
  return select;
}

/** Build the editor card from state.edit. Structural changes rebuild it via redrawEditor. */
function buildEditor() {
  const { task, options, draft, shown } = state.edit;
  const locked = task.completed; // Completed tasks are shown read-only.
  const card = el("div", "editor");
  card.dataset.id = task.id;
  card.onkeydown = (event) => {
    if (event.key !== "Escape") return;
    if (state.edit.picker) closePicker(); else closeEditor(); // Escape closes the picker first.
  };

  // Title, with the checkbox shown for context.
  const head = el("div", "head");
  const check = el("span", "check");
  check.innerHTML = TICK; // Static icon markup only.
  if (task.completed) check.style.background = "var(--muted)";
  const title = el("input", "ed-title");
  title.value = draft.title;
  title.placeholder = "New To-Do";
  title.oninput = () => { draft.title = title.value; };
  title.onkeydown = (event) => { if (event.key === "Enter") saveEditor(); };
  head.append(check, title);
  card.append(head);

  const notes = el("textarea");
  notes.value = draft.notes;
  notes.placeholder = "Notes";
  notes.rows = Math.min(10, Math.max(2, draft.notes.split("\n").length));
  notes.oninput = () => { draft.notes = notes.value; };
  card.append(notes);

  if (shown.tags) {
    const chips = draft.tags.map((tag) => {
      const chip = el("span", "chip", tag);
      const remove = el("button", "ed-x", "✕");
      remove.type = "button";
      remove.title = `Remove ${tag}`;
      remove.onclick = () => { draft.tags = draft.tags.filter((t) => t !== tag); redrawEditor(); };
      chip.append(remove);
      return chip;
    });
    const available = options.tags.filter((t) => !draft.tags.includes(t));
    const add = selectOf([["", "Add tag…"], ...available.map((t) => [t, t])], "");
    add.onchange = () => { if (add.value) { draft.tags.push(add.value); redrawEditor(); } };
    card.append(editorRow("Tags", ...chips, add));
  }

  if (shown.when) {
    const label = { today: "★ Today", someday: "Someday", anytime: "Anytime" }[draft.when.kind]
      || "📅 " + dateLabel(draft.when.date);
    const tomorrow = addDays(state.edit.today, 1);
    const parts = [dateButton(label, "when", false)];
    if (draft.when.date !== tomorrow) {
      // Defer to tomorrow in one click; the deadline is left as it is.
      const defer = el("button", "secondary ed-tomorrow", "Tomorrow");
      defer.type = "button";
      defer.onclick = () => { setStartDate(tomorrow); state.edit.picker = null; redrawEditor(); };
      parts.push(defer);
    }
    card.append(editorRow("When", ...parts));
    if (state.edit.picker === "when") card.append(buildPicker("when"));
  }

  if (shown.deadline) {
    const overdue = draft.deadline && draft.deadline < state.edit.today;
    const button = dateButton(draft.deadline ? "⚑ " + dateLabel(draft.deadline) : "⚑ Pick a date", "deadline", overdue);
    const clear = el("button", "ed-x", "✕");
    clear.type = "button";
    clear.title = "Remove deadline";
    clear.onclick = () => { draft.deadline = ""; shown.deadline = false; state.edit.picker = null; redrawEditor(); };
    card.append(editorRow("Deadline", button, clear));
    if (state.edit.picker === "deadline") card.append(buildPicker("deadline"));
  }

  if (shown.list) {
    const list = el("select");
    if (!task.list_id) list.append(Object.assign(el("option", "", "None"), { value: "" }));
    for (const [label, items] of [["Areas", options.areas], ["Projects", options.projects]]) {
      const group = el("optgroup");
      group.label = label;
      for (const item of items) group.append(Object.assign(el("option", "", item.title), { value: item.id }));
      if (items.length) list.append(group);
    }
    list.value = draft.list_id || "";
    list.onchange = () => {
      draft.list_id = list.value || null;
      draft.heading_id = null; // A heading belongs to one project.
      redrawEditor();
    };
    const parts = [list];
    const headings = options.headings.filter((h) => h.project === draft.list_id);
    if (headings.length) {
      // "No heading" is only offered when it is already the case: Things' URL
      // command can move a to-do under a heading, but not out from under one.
      const keepsHeading = task.heading_id && draft.list_id === task.list_id;
      const pairs = keepsHeading ? [] : [["", "No heading"]];
      const heading = selectOf([...pairs, ...headings.map((h) => [h.id, h.title])], draft.heading_id || "");
      heading.onchange = () => { draft.heading_id = heading.value || null; };
      parts.push(heading);
    }
    card.append(editorRow("Project", ...parts));
  }

  const seg = el("span", "seg");
  for (const p of ["P1", "P2", "P3"]) {
    const button = el("button", p === draft.priority ? "on" : "", p);
    button.type = "button";
    button.disabled = locked;
    button.onclick = () => { draft.priority = p; redrawEditor(); };
    seg.append(button);
  }
  card.append(editorRow("Priority", seg));
  if (draft.priority !== task.priority) {
    card.append(el("div", "note",
      "Moving into P1 sets a missing deadline to today; moving out of P1 removes a deadline of today or earlier. A later deadline is kept, and a deadline you set here wins."));
  }
  if (locked) {
    card.append(el("div", "note", "Completed. Uncheck it to edit."));
    for (const input of card.querySelectorAll("input, textarea, select, button")) input.disabled = true;
  }

  const foot = el("div", "foot");
  const save = el("button", "", "Save");
  save.type = "button";
  save.disabled = locked;
  save.onclick = saveEditor;
  const cancel = el("button", "secondary", "Cancel");
  cancel.type = "button";
  cancel.onclick = closeEditor;
  const things = el("button", "secondary", "Open in Things");
  things.type = "button";
  things.onclick = () => openTask(task.id);
  foot.append(save, cancel, things);
  if (task.checklist.total) {
    // The checklist is edited in Things (replacing it from here would reset ticks).
    const checklist = el("span", "checklist",
      `☑ Checklist: ${task.checklist.done} of ${task.checklist.total} done`);
    checklist.title = "Edit the checklist in Things";
    foot.append(checklist);
  }
  if (!locked) {
    const adders = el("span", "adders");
    for (const [key, label] of [["tags", "+ Tags"], ["when", "+ When"], ["deadline", "+ Deadline"], ["list", "+ Project"]]) {
      if (shown[key]) continue;
      const add = el("button", "", label);
      add.type = "button";
      add.onclick = () => {
        shown[key] = true;
        // Dates are chosen in the picker, which opens straight away.
        if (key === "when" || key === "deadline") openPicker(key);
        redrawEditor();
      };
      adders.append(add);
    }
    foot.append(adders);
  }
  card.append(foot, el("div", "ed-status"));
  return card;
}

// --- Date picker -------------------------------------------------------------

/** Format YYYY-MM-DD as "Sat, Nov 7" (with the year if it isn't this year). */
function dateLabel(iso) {
  const day = new Date(iso + "T12:00:00"); // Noon, so no time zone shifts the date.
  const options = { weekday: "short", month: "short", day: "numeric" };
  if (iso.slice(0, 4) !== state.edit.today.slice(0, 4)) options.year = "numeric";
  return day.toLocaleDateString(undefined, options);
}

/** A row button showing a date; clicking it opens or closes that row's picker. */
function dateButton(label, which, overdue) {
  const button = el("button", "ed-date" + (overdue ? " overdue" : ""), label);
  button.type = "button";
  button.onclick = () => {
    if (state.edit.picker === which) closePicker(); else { openPicker(which); redrawEditor(); }
  };
  return button;
}

/** Open the picker for "when" or "deadline", showing the month of its current date. */
function openPicker(which) {
  const { draft, today } = state.edit;
  const current = which === "when" ? draft.when.date : draft.deadline;
  state.edit.picker = which;
  state.edit.pickerMonth = (current || today).slice(0, 8) + "01";
}

/** Close the picker. A row opened with + and left without a date is hidden again. */
function closePicker() {
  const { draft, shown, task } = state.edit;
  if (state.edit.picker === "deadline" && !draft.deadline) shown.deadline = false;
  if (state.edit.picker === "when" && draft.when.kind === "anytime" && task.when.kind === "anytime") {
    shown.when = false;
  }
  state.edit.picker = null;
  redrawEditor();
}

/**
 * Set the chosen date (or keyword for When) and close the picker. Someday and
 * Anytime also remove the deadline, matching the server's plan_edit rule.
 */
function pickDate(which, value) {
  const { draft, shown } = state.edit;
  if (which === "deadline") {
    draft.deadline = value;
  } else if (value === "someday" || value === "anytime") {
    draft.when = { kind: value, date: null };
    draft.deadline = "";
    shown.deadline = false;
  } else {
    setStartDate(value);
  }
  state.edit.picker = null;
  redrawEditor();
}

/**
 * Set the draft's start date. Deferring to a date after today also moves a
 * deadline that is before that date to it, matching the server's plan_edit rule.
 */
function setStartDate(iso) {
  const { draft, today } = state.edit;
  draft.when = { kind: iso === today ? "today" : "date", date: iso };
  if (iso > today && draft.deadline && draft.deadline < iso) draft.deadline = iso;
}

/** Return the YYYY-MM-DD date `days` after `iso`. */
function addDays(iso, days) {
  const [y, m, d] = iso.split("-").map(Number);
  const next = new Date(y, m - 1, d + days);
  return `${next.getFullYear()}-${pad2(next.getMonth() + 1)}-${pad2(next.getDate())}`;
}

/** Pad a number to two digits. */
function pad2(n) {
  return String(n).padStart(2, "0");
}

/** Build the date picker: quick choices, a month header and a calendar grid. */
function buildPicker(which) {
  const { draft, today, pickerMonth } = state.edit;
  const chosen = which === "deadline" ? draft.deadline : draft.when.date;
  const picker = el("div", "picker");
  const quick = el("div", "quick");
  const choices = which === "when"
    ? [["★ Today", today], ["Someday", "someday"], ["Anytime", "anytime"]]
    : [["Today", today], ["Clear", ""]];
  for (const [label, value] of choices) {
    const button = el("button", "", label);
    button.type = "button";
    button.onclick = () => {
      if (which === "deadline" && value === "") {
        draft.deadline = "";
        closePicker();
      } else {
        pickDate(which, value);
      }
    };
    quick.append(button);
  }
  picker.append(quick);

  const [year, month] = pickerMonth.split("-").map(Number);
  const header = el("div", "month");
  const prev = el("button", "", "‹");
  const next = el("button", "", "›");
  prev.type = next.type = "button";
  const shift = (delta) => {
    const first = new Date(year, month - 1 + delta, 1);
    state.edit.pickerMonth = `${first.getFullYear()}-${pad2(first.getMonth() + 1)}-01`;
    redrawEditor();
  };
  prev.onclick = () => shift(-1);
  next.onclick = () => shift(1);
  const title = new Date(year, month - 1, 1).toLocaleDateString(undefined, { month: "long", year: "numeric" });
  header.append(prev, el("span", "", title), next);
  picker.append(header);

  const grid = el("div", "grid");
  for (const dow of ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"]) grid.append(el("span", "dow", dow));
  const firstWeekday = new Date(year, month - 1, 1).getDay();
  for (let i = 0; i < firstWeekday; i++) grid.append(el("span"));
  const days = new Date(year, month, 0).getDate();
  for (let day = 1; day <= days; day++) {
    const iso = `${year}-${pad2(month)}-${pad2(day)}`;
    const classes = [iso === today ? "today" : "", iso === chosen ? "chosen" : ""].join(" ").trim();
    const button = el("button", classes, String(day));
    button.type = "button";
    button.onclick = () => pickDate(which, iso);
    grid.append(button);
  }
  picker.append(grid);
  return picker;
}

/** Compare the draft with the task as loaded; return {changes} or {error}. */
function editorChanges() {
  const { task, draft } = state.edit;
  const changes = {};
  if (!draft.title.trim()) return { error: "The title can't be empty." };
  if (draft.title.trim() !== task.title) changes.title = draft.title.trim();
  if (draft.notes !== task.notes) changes.notes = draft.notes;
  const when = draft.when;
  if (when.kind !== task.when.kind || (when.kind === "date" && when.date !== task.when.date)) {
    changes.when = when.kind === "date" ? when.date : when.kind;
  }
  if (draft.deadline !== (task.deadline || "")) changes.deadline = draft.deadline;
  if (draft.priority !== task.priority) changes.priority = draft.priority;
  if ([...draft.tags].sort().join("\u001f") !== [...task.other_tags].sort().join("\u001f")) changes.tags = draft.tags;
  if (draft.list_id && draft.list_id !== task.list_id) changes.list_id = draft.list_id;
  if (draft.heading_id && draft.heading_id !== task.heading_id) changes.heading_id = draft.heading_id;
  return { changes };
}

/** Send the edits to Things; close the editor once Things confirms them. */
function saveEditor() {
  const { changes, error } = editorChanges();
  if (error) { editorMessage(error); return; }
  if (!Object.keys(changes).length) { closeEditor(); return; }
  const { task, draft, card } = state.edit;
  // Close the card straight away, showing the task as edited.
  // Only the Overdue search shows P tags; elsewhere the list shows the priority (as the server sends it).
  const tags = state.list === "overdue" ? [...draft.tags, draft.priority] : draft.tags;
  const row = taskRow({ ...task, title: draft.title.trim(), tags }, null);
  card.replaceWith(row);
  state.edit = null;
  enqueue(row, "the changes", () => api("/api/edit", { id: task.id, changes }));
}

/** Close the editor without saving and redraw the list. */
function closeEditor() {
  state.edit = null;
  load();
}

/** Ask the server to open a task in Things for editing. */
async function openTask(id) {
  try {
    await api("/api/open", { id });
  } catch (error) {
    setStatus(error.message);
  }
}

/** Open one of Things' own lists (Inbox, Upcoming, ...) in Things. */
async function showThingsList(name) {
  try {
    await api("/api/show-list", { name });
  } catch (error) {
    setStatus(error.message);
  }
}

// --- Settings -----------------------------------------------------------------

/** Apply an appearance ("dark" or "light") to the page. */
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme === "light" ? "light" : "dark";
}

/** Show the Settings page: replace the auth token, choose the appearance. */
function showSettings() {
  state.view = "settings";
  state.edit = null; // Opening Settings closes an open editor without saving.
  renderSidebar();
  const content = document.getElementById("content");
  content.replaceChildren();
  const page = el("div", "settings");
  const heading = el("h1");
  heading.innerHTML = ICONS.settings; // Static icon markup only.
  heading.append("Settings");
  page.append(heading);

  page.append(el("h2", "", "Things auth token"));
  page.append(el("p", "", "Do Things uses it to change tags, dates and completion in Things."));
  const replace = el("button", "secondary", "Replace token…");
  replace.onclick = () => showSetup(false, "settings");
  page.append(replace);

  page.append(el("h2", "", "Appearance"));
  const seg = el("span", "seg");
  for (const [value, label] of [["dark", "Dark"], ["light", "Light"]]) {
    const button = el("button", value === state.theme ? "on" : "", label);
    button.type = "button";
    button.onclick = () => {
      state.theme = value;
      saveSetting("theme", value);
      applyTheme(value);
      showSettings();
    };
    seg.append(button);
  }
  page.append(seg);
  content.append(page);
}

// --- Setup (auth token) --------------------------------------------------------

/**
 * Show the token screen. `firstRun` hides the Cancel button. Saving or
 * cancelling returns to `returnTo`: the task list, or the Settings page.
 */
function showSetup(firstRun, returnTo = "list") {
  const back = () => {
    if (returnTo === "settings") { showSettings(); return; }
    state.view = "list";
    load();
  };
  state.view = "setup";
  renderSidebar();
  const content = document.getElementById("content");
  content.replaceChildren();
  const box = el("div", "setup");
  box.append(el("h1", "", firstRun ? "Welcome to Do Things" : "Things auth token"));
  box.append(el("p", "", "Do Things needs your Things auth token to change tags and deadlines."));
  const steps = el("ol");
  for (const step of [
    "Open Things and choose Things › Settings.",
    "In General, turn on Enable Things URLs.",
    "Click Manage and copy the authorization token.",
    "Paste it below and click Save.",
  ]) steps.append(el("li", "", step));
  const input = el("input");
  input.type = "password";
  input.placeholder = "Auth token";
  input.autocomplete = "off";
  const message = el("div", "error");
  const save = el("button", "", "Save");
  save.onclick = async () => {
    try {
      await api("/api/token", { token: input.value });
      back();
    } catch (error) {
      message.textContent = error.message;
    }
  };
  input.onkeydown = (event) => { if (event.key === "Enter") save.click(); };
  box.append(steps, input, message, save);
  if (!firstRun) {
    const cancel = el("button", "secondary", "Cancel");
    cancel.style.marginLeft = "8px";
    cancel.onclick = back;
    box.append(cancel);
  }
  content.append(box);
  input.focus();
}

// --- Loading -----------------------------------------------------------------

/** Fetch and show the current list. Skipped while saving, dragging, editing or in setup. */
async function load() {
  if (state.busy || state.pending || state.drag || state.edit || state.view !== "list") return;
  renderSidebar();
  try {
    const hide = state.hideCompleted ? "&hide_completed=1" : "";
    const data = await api(`/api/list?name=${encodeURIComponent(state.list)}${hide}`);
    if (!data.token_set) { showSetup(true); return; }
    state.counts = data.counts;
    renderSidebar(); // Again, now with the fresh counts.
    renderList(data);
  } catch (error) {
    const content = document.getElementById("content");
    content.replaceChildren(el("div", "banner", error.message));
  }
}

/** Load the version, show the first list, and start the refresh timers. */
async function start() {
  applyTheme(state.theme);
  try {
    state.version = (await api("/api/status")).version;
  } catch (error) {
    // The list request below reports the problem.
  }
  load();
  setInterval(load, REFRESH_MS);
  window.addEventListener("focus", load);
  // A click outside an open date picker (and its row button) closes it, as in Things.
  // "click" (not "mousedown") so the clicked control, e.g. Save, acts first.
  // A control the card has just redrawn (e.g. "+ Deadline", which opens the
  // picker) is no longer on the page; that click isn't "outside".
  document.addEventListener("click", (event) => {
    const outside = event.target.isConnected && !event.target.closest(".picker, .ed-date");
    if (state.edit && state.edit.picker && outside) closePicker();
  });
}

start();
</script>
